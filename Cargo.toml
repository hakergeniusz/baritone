[package]
name = "baritone"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "Baritone pathfinding bot ported to Horizon (Rust Minecraft rewrite)"
repository = "https://github.com/hakergeniusz/baritone"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
hashbrown = "0.15"

[[bin]]
name = "baritone"
path = "src/main.rs"

[lib]
name = "baritone"
path = "src/lib.rs"
